<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paola Galvão Studio</title>

    <!-- Bootstrap 5 -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Aos Animações -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />

    <!-- Estilos Customizados -->
    <link rel="stylesheet" href="css/token.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      size="32X32"
      href="assets/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon-32x32.png"
    />
  </head>
  <body>
    <header class="main-header">
      <nav
        id="navbar"
        class="navbar navbar-expand-lg"
        aria-label="Navegação principal"
      >
        <div class="container">
          <a class="navbar-brand" href="index.html" aria-label="Paola Galvão Studio - Início">
            <img
              src="assets/images//logo.png"
              alt="Paola Galvão Studio - Especialista em Beleza e Bem-estar"
              class="logo-img"                           
            />
          </a>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navMenu" 
            aria-controls="navMenu"
            aria-expanded="false"
            aria-label="Alternar navegação"
          >
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
          </button>

          <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-4">
                
              <li class="nav-item">
                <a class="nav-link text-uppercase" href="#">Sobre</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-uppercase" href="#">Serviços</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-uppercase" href="#">Avaliações</a>
              </li>
              <li class="nav-item">
                <a class="nav-link text-uppercase" href="#">Contato</a>
              </li>
              <li class="nav-item ms-lg-3" >
                <a class="btn btn-primario text-uppercase" href="#" role="button">Agendar</a>
              </li>

            </ul>
          </div>
        </div>
      </nav>
    </header>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
